[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-image-cleanup-agent"
version = "0.1.0"
description = "Local, auditable cleanup for authorized images"
requires-python = ">=3.10,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=9.5,<12",
  "opencv-python>=4.8,<5",
  "easyocr==1.7.2",
  "simple-lama-inpainting==0.1.2",
  "torch>=2.6,<3",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "streamlit>=1.64,<2",
]

[project.scripts]
image-cleanup = "image_cleanup.cli:main"

[tool.setuptools.packages.find]
include = ["image_cleanup*"]
